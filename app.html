<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cons App | Token and message routing</title>
<meta name="description" content="Route tokens and messages across chains from one Solana native interface.">
<meta name="theme-color" content="#fafafa">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cons">
<meta property="og:title" content="Cons App | Token and message routing">
<meta property="og:description" content="Compare routes, track requests and read normalized receipts.">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/basier-circle-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body class="app-body">
<a class="skip-link" href="#view">Skip to content</a>

<header class="app-top">
  <a class="brand" href="/" aria-label="Cons home"><span data-mark></span>cons</a>
  <span class="app-sep" aria-hidden="true">/</span>
  <span class="app-crumb" id="crumb">Token routing</span>
  <div class="app-top-right">
    <span class="tag plain net" id="net-pill" title="Solana cluster"></span>
    <span class="tag" id="mode-pill"></span>
    <a class="btn btn-ghost btn-sm hide-sm" data-link="docs" href="/docs/">Docs</a>
    <button class="btn btn-primary btn-sm" id="wallet-btn" type="button"><span data-icon="wallet"></span><span class="wl">Connect wallet</span></button>
  </div>
</header>

<div class="app-shell">
  <aside class="side" aria-label="App navigation">
    <nav class="side-nav">
      <p class="side-label">Route</p>
      <a href="#/token" data-route="token"><span data-icon="token"></span>Token routing</a>
      <a href="#/message" data-route="message"><span data-icon="message"></span>Message routing</a>
      <p class="side-label">Monitor</p>
      <a href="#/activity" data-route="activity"><span data-icon="activity"></span>Activity</a>
      <a href="#/receipt" data-route="receipt"><span data-icon="receipt"></span>Receipts</a>
      <a href="#/providers" data-route="providers"><span data-icon="providers"></span>Providers</a>
    </nav>
    <div class="side-status" aria-label="Integration status">
      <p class="side-label">Integration</p>
      <dl id="integration"></dl>
    </div>
  </aside>

  <main class="view" id="view" tabindex="-1" aria-live="polite"></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-x" type="button" data-close aria-label="Close"><span data-icon="close"></span></button>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p class="noscript">The Cons app needs JavaScript.</p></noscript>
<script type="module" src="/src/app/main.js"></script>
</body>
</html>
